name: Build LDW-Cinema-Next

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_repo:
        description: "TVBox/CatVod 底座仓库 (owner/repo@ref)，留空则只构建后端"
        required: false
        default: ""
      base_token:
        description: "访问底座仓库的 token（如私有）"
        required: false
        default: ""

jobs:
  # ---------- 后端：自维护片源 API（规格 4/5） ----------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行片源流水线
        working-directory: backend
        run: python -m src.main --once
      - name: 校验产物
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          d=json.load(open('dist/combined.json',encoding='utf-8'))
          assert d['sites'], "sites 为空"
          assert d['posterConfig']['proxyUrl'], "posterProxy 缺失"
          print("combined.json OK:", len(d['sites']), "sites,", len(d['lives']), "lives")
          PY
      - name: 发布片源清单到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sources-latest
          name: 片源清单（自动维护）
          files: |
            backend/dist/combined.json
            backend/dist/live.json
            backend/state/health.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Android：构建 APK（规格 1/2/3） ----------
  android:
    if: ${{ inputs.base_repo != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: next }
      - name: 检出底座仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repo }}
          token: ${{ inputs.base_token }}
          path: base
      - name: 叠加 next 自定义模块
        run: |
          cp -r next/app/src/main/java/com/ldw/cinema/next base/app/src/main/java/com/ldw/cinema/next
          # 将 update-mobile.json 放到底座 assets，供 UpdateManager 使用
          mkdir -p base/app/src/main/assets
          cp next/backend/dist/combined.json base/app/src/main/assets/ 2>/dev/null || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: 编译 Release
        working-directory: base
        run: ./gradlew assembleRelease
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: base/app/build/outputs/apk/release/*.apk
