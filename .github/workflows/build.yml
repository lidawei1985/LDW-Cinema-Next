name: Build LDW-Cinema-Next

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_repo:
        description: "TVBox/CatVod 底座仓库 (owner/repo)，留空则用默认 lidawei1985/TVBoxOS"
        required: false
        default: "lidawei1985/TVBoxOS"

permissions:
  contents: write

jobs:
  # ---------- 后端：自维护片源 API（规格 4/5） ----------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行片源流水线
        working-directory: backend
        run: python -m src.main --once
      - name: 校验产物
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          d=json.load(open('dist/combined.json',encoding='utf-8'))
          assert d['sites'], "sites 为空"
          assert d['posterConfig']['proxyUrl'], "posterProxy 缺失"
          print("combined.json OK:", len(d['sites']), "sites,", len(d['lives']), "lives")
          PY
      - name: 发布片源清单到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sources-latest
          name: 片源清单（自动维护）
          files: |
            backend/dist/combined.json
            backend/dist/live.json
            backend/state/health.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Android：基于 TVBoxOS 底座自动编译正式 APK（规格 1/2/3 底座） ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出底座源码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.base_repo != '' && inputs.base_repo || 'lidawei1985/TVBoxOS' }}
          path: base
      - name: 安装 JDK 11（AGP 4.2.2 / Gradle 7.3.3 编译用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: 安装 JDK 17（供 sdkmanager 安装 SDK 组件）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 设置 Android SDK (platform-30)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-30 build-tools;30.0.3'
      - name: 配置 SDK 路径
        run: echo "sdk.dir=$ANDROID_HOME" > base/local.properties
      - name: 修复 build.gradle（内联公共仓库，绕开 buildscript 闭包作用域限制）
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('base/build.gradle')
          s = p.read_text(encoding='utf-8')
          repos = [
              'gradlePluginPortal()',
              'google()',
              'mavenCentral()',
              'maven { url "https://jitpack.io" }',
              'maven { url "https://maven.aliyun.com/repository/releases" }',
              'maven { url "https://maven.aliyun.com/repository/public" }',
              'maven { url "https://storage.googleapis.com/r8-releases/raw" }',
          ]
          def repl(m):
              indent = m.group(1)
              return '\n'.join(indent + line for line in repos)
          s2 = re.sub(r'\n([ \t]*)commonRepositories\(\)', repl, s)
          p.write_text(s2, encoding='utf-8')
          print('patched build.gradle, replaced', s.count('commonRepositories()'), 'call(s)')
          PY
      - name: 编译 Release
        working-directory: base
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: 签名 APK（优先自有密钥 Secrets，缺失则临时密钥）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          UNSIGNED=$(ls base/app/build/outputs/apk/release/*-unsigned.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEY="$RUNNER_TEMP/ldwl.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEY"
            "$APKSIGNER" sign --ks "$KEY" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASS" --key-pass "pass:$KEY_PASS" \
              --out base/app/build/outputs/apk/release/app-release-signed.apk "$UNSIGNED"
            echo "已使用自有签名密钥签名（alias=$KEY_ALIAS）"
          else
            KEY="$RUNNER_TEMP/ldwl.jks"
            keytool -genkey -v -keystore "$KEY" -keyalg RSA -keysize 2048 -validity 3650 \
              -alias ldwl -storepass android -keypass android -dname "CN=LDW,O=LDW,C=CN"
            "$APKSIGNER" sign --ks "$KEY" --ks-key-alias ldwl --ks-pass pass:android \
              --key-pass pass:android --out base/app/build/outputs/apk/release/app-release-signed.apk "$UNSIGNED"
            echo "未配置自有密钥，使用临时密钥签名（仅供测试，正式发布请到仓库 Settings→Secrets 配置 KEYSTORE_BASE64/KEY_ALIAS/KEY_STORE_PASS/KEY_PASS）"
          fi
      - name: 上传 APK（artifact 备份）
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: base/app/build/outputs/apk/release/app-release-signed.apk
      - name: 删除旧 app-latest Release/Tag（若存在，便于覆盖发布）
        continue-on-error: true
        run: |
          gh release delete app-latest --yes -R lidawei1985/LDW-Cinema-Next || true
          gh api -X DELETE repos/lidawei1985/LDW-Cinema-Next/git/refs/tags/app-latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布 APK 到 Release app-latest（稳定下载链接）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 安卓正式 APK（TVBoxOS 底座，已签名）
          files: base/app/build/outputs/apk/release/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
